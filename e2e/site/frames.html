<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frames fixture</title>
    <style>
      body { margin: 0; font: 16px sans-serif; background: #fff; }
      iframe { position: absolute; width: 300px; height: 200px; border: 4px solid #999; }
      #widget { position: absolute; left: 100px; top: 420px; }
    </style>
  </head>
  <body>
    <iframe id="same" style="left: 40px; top: 120px" src="inner.html?colour=7c3aed&label=Pay"></iframe>
    <iframe id="other" style="left: 500px; top: 120px"></iframe>
    <div id="widget"></div>
    <script>
      // The same page served from another origin (localhost, not 127.0.0.1).
      document.getElementById("other").src = `http://localhost:${location.port}/inner.html?colour=dc2626&label=Donate`;
      // A widget in a closed shadow root.
      const root = document.getElementById("widget").attachShadow({ mode: "closed" });
      root.innerHTML = '<button style="width:160px;height:60px;border:0;background:#0d9488;color:#fff">Follow</button>';
    </script>
  </body>
</html>
